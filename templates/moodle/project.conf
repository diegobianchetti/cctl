#!/bin/bash
# project.conf — Manifest Moodle para cctl
#
# Este arquivo declara tudo que o cctl precisa saber sobre o projeto.
# Sourceable pelo bash (sem dependencias externas).

PROJECT_TYPE="moodle"

# Variaveis setadas pelo cctl init
CLIENT_NAME="_CLIENT_NAME_"
DOMAIN_NAME="_DOMAIN_NAME_"
COMPOSE_PROJECT_NAME="_COMPOSE_PROJECT_NAME_"

# Path do .env relativo a raiz da instancia
ENV_FILE="docker/.env"
ENV_TEMPLATE="docker/.env.template"

# Compose files (relativos a raiz)
COMPOSE_FILES=("docker/docker-compose.yaml")

# Templates a renderizar durante install (src:dst)
# Usa {{PLACEHOLDER}} — substituidos pelos valores do .env
TEMPLATE_FILES=(
    "nginx/site.conf.template:nginx/site.conf"
    "nginx/site-nossl.conf.template:nginx/site-nossl.conf"
    "cron/backup-db.cron.template:cron/backup-db.cron"
    "cron/exec-cron-moodle.cron.template:cron/exec-cron-moodle.cron"
    "cron/logrotate-apache.template:cron/logrotate-apache"
)

# Senhas geradas automaticamente no servidor (substituem _VARNAME_ no .env)
AUTO_PASSWORD_VARS=("POSTGRESQL_PASSWORD" "MOODLE_ADMIN_PASSWORD")

# Variaveis obrigatorias (validadas antes do deploy)
REQUIRED_VARS=("POSTGRESQL_PASSWORD" "MOODLE_ADMIN_PASSWORD" "DOMAIN_NAME" "COMPOSE_PROJECT_NAME")

# Nginx reverse proxy no host
HOST_NGINX=true
HOST_SSL=true
SSL_MODE="letsencrypt"
CERTBOT_EMAIL=""

# Cron no host
HOST_CRON=true

# Database
DB_SERVICE="moodle-db"
DB_TYPE="postgresql"
DB_CUSTOM_CONFIG="./custom-config/postgres/custom-postgresql.conf"
DB_CONFIG_PATH="/var/lib/postgresql/data/conf.d/custom.conf"

# Servicos conectaveis via cctl connect
CONNECTABLE_SERVICES=("moodle-app" "moodle-db")

# Rede
SUBNET_RANGE="172.32.0.0/16"
SUBNET_PREFIX_LEN=24

# Backup
BACKUP_DIR="./backups"
BACKUP_RETENTION=3

# Hook pos-install
HOOK_POST_INSTALL="post-install.sh"
