#!/bin/bash
# project.conf — Manifest DSpace para cctl
#
# Este arquivo declara tudo que o cctl precisa saber sobre o projeto.
# Sourceable pelo bash (sem dependencias externas).

PROJECT_TYPE="dspace"

# Variaveis setadas pelo cctl init
CLIENT_NAME="_CLIENT_NAME_"
DOMAIN_NAME="_DOMAIN_NAME_"
COMPOSE_PROJECT_NAME="_COMPOSE_PROJECT_NAME_"

# Path do .env relativo a raiz da instancia
ENV_FILE="docker/.env"
ENV_TEMPLATE="docker/.env.template"

# Compose files (relativos a raiz, ordem importa)
COMPOSE_FILES=(
    "docker/docker-compose.yaml"
    "docker/docker-compose.frontend.yaml"
)

# Templates a renderizar durante install (src:dst)
# Usa ${VAR} — substituidos pelos valores do .env
TEMPLATE_FILES=(
    "nginx/site.conf.template:nginx/site.conf"
    "cron/cron-dspace.template:cron/cron-dspace.cron"
)

# Senhas geradas automaticamente no servidor (substituem _VARNAME_ no .env)
AUTO_PASSWORD_VARS=("POSTGRES_PASSWORD")

# Variaveis obrigatorias (validadas antes do deploy)
REQUIRED_VARS=(
    "POSTGRES_PASSWORD"
    "DOMAIN_NAME"
    "COMPOSE_PROJECT_NAME"
    "COMPOSE_PROJECT_SUBNET"
    "DOCKER_OWNER"
    "DSPACE_VER"
    "DSPACE_PROTOCOL"
    "DSPACE_UI_SSL"
    "DSPACE_REST_SSL"
)

# Nginx reverse proxy no host
HOST_NGINX=true
HOST_SSL=false
SSL_MODE="none"
CERTBOT_EMAIL=""

# Cron no host
HOST_CRON=true

# Database
DB_SERVICE="dspacedb"
DB_TYPE="postgresql"

# Servicos conectaveis via cctl connect
CONNECTABLE_SERVICES=("dspace" "dspacedb" "dspacesolr" "dspace-angular")

# Servico alvo do "cctl rollout" (Blue/Green/Rolling). String simples (nao
# array) — o vhost do dspace tem DOIS "set $target" (backend e frontend);
# ROLLOUT_SERVICE torna explicito qual dos dois e o alvo por padrao (o outro
# ainda pode ser escolhido via --service).
ROLLOUT_SERVICE="dspace-angular"

# Rede
SUBNET_RANGE="10.88.0.0/16"
SUBNET_PREFIX_LEN=24

# Backup
BACKUP_DIR="./backups"
BACKUP_RETENTION=3

# Hook pos-install
HOOK_POST_INSTALL="post-install.sh"
