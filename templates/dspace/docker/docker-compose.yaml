## docker-compose.yaml — DSpace Backend + Database + Solr
## Gerenciado pelo cctl — nao editar manualmente

networks:
  dspacenet:
    ipam:
      config:
        - subnet: ${COMPOSE_PROJECT_SUBNET}

services:
  # DSpace (backend) webapp container
  dspace:
    container_name: ${COMPOSE_PROJECT_NAME}-dspace
    hostname: backend
    restart: always
    environment:
      dspace__P__dir: /dspace
      dspace__P__server__P__url: ${DSPACE_PROTOCOL}://${DOMAIN_NAME}/server
      dspace__P__ui__P__url: ${DSPACE_PROTOCOL}://${DOMAIN_NAME}
      dspace__P__name: ${DSPACE_DISPLAY_NAME}
      db__P__url: 'jdbc:postgresql://dspacedb:5432/dspace'
      solr__P__server: http://dspacesolr:8983/solr
      proxies__P__trusted__P__ipranges: "${COMPOSE_PROJECT_SUBNET}"
      LOGGING_CONFIG: /dspace/config/log4j2.xml
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=500 -Xms512M -Xmx1512M -Dfile.encoding=UTF-8"
    image: "${DOCKER_OWNER}/dspace:${DSPACE_VER}"
    deploy:
      resources:
        limits:
          memory: ${DSPACE_MEMORY_LIMIT}
          cpus: ${DSPACE_CPU_LIMIT}
    depends_on:
      - dspacedb
    networks:
      - dspacenet
    stdin_open: true
    tty: true
    volumes:
      - assetstore:/dspace/assetstore
      - backend_logs:/dspace/log
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        while (!</dev/tcp/dspacedb/5432) > /dev/null 2>&1; do sleep 1; done;
        /dspace/bin/dspace database migrate
        /dspace/bin/dspace generate-sitemaps
        java -jar /dspace/webapps/server-boot.jar --dspace.dir=/dspace

  # DSpace PostgreSQL database container
  dspacedb:
    container_name: ${COMPOSE_PROJECT_NAME}-dspacedb
    hostname: db
    image: "${DOCKER_OWNER}/dspace-postgres:${DSPACE_VER}"
    restart: always
    deploy:
      resources:
        limits:
          memory: ${POSTGRESQL_MEMORY_LIMIT}
          cpus: ${POSTGRESQL_CPU_LIMIT}
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    networks:
      dspacenet:
    stdin_open: true
    tty: true
    volumes:
      - pgdata:/pgdata
      - db_backup:/var/backups

  # DSpace Solr container
  dspacesolr:
    container_name: ${COMPOSE_PROJECT_NAME}-dspacesolr
    hostname: solr
    image: "${DOCKER_OWNER}/dspace-solr:${DSPACE_VER}"
    restart: always
    environment:
      SOLR_ULIMIT_CHECKS: false
    deploy:
      resources:
        limits:
          memory: ${APACHE_SOLR_MEMORY_LIMIT}
          cpus: ${APACHE_SOLR_CPU_LIMIT}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      dspacenet:
    stdin_open: true
    tty: true
    working_dir: /var/solr/data
    volumes:
      - solr_data:/var/solr/data
      - solr_logs:/var/solr/logs
    user: root
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        init-var-solr
        precreate-core authority /opt/solr/server/solr/configsets/authority
        cp -r /opt/solr/server/solr/configsets/authority/* authority
        precreate-core oai /opt/solr/server/solr/configsets/oai
        cp -r /opt/solr/server/solr/configsets/oai/* oai
        precreate-core search /opt/solr/server/solr/configsets/search
        cp -r /opt/solr/server/solr/configsets/search/* search
        precreate-core statistics /opt/solr/server/solr/configsets/statistics
        cp -r /opt/solr/server/solr/configsets/statistics/* statistics
        precreate-core qaevent /opt/solr/server/solr/configsets/qaevent
        cp -r /opt/solr/server/solr/configsets/qaevent/* qaevent
        precreate-core suggestion /opt/solr/server/solr/configsets/suggestion
        cp -r /opt/solr/server/solr/configsets/suggestion/* suggestion
        chown -R solr:solr /var/solr
        runuser -u solr -- solr-foreground

volumes:
  assetstore:
  pgdata:
  solr_data:
  solr_logs:
  db_backup:
  backend_logs:
