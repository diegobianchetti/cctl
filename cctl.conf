# shellcheck shell=bash
# cctl.conf — Defaults globais do containers-control
#
# Usa ${VAR:-...} para nao anular overrides ja definidos no ambiente antes
# do source (ex: CCTL_REGISTRY exportado na sessao do shell).

# Raiz base unica do cctl no host. Tudo abaixo (instancias, nginx, certs,
# certbot, letsencrypt) deriva daqui — uma so variavel para mover o layout
# inteiro (ex.: CCTL_BASE_DIR=/var/containers). Cada folha mantem seu proprio
# escape hatch "${VAR:-...}", entao e possivel sobrescrever so uma delas sem
# mexer na raiz.
CCTL_BASE_DIR="${CCTL_BASE_DIR:-/opt/cctl}"

# Diretorio base das instancias no servidor
CCTL_INSTANCE_BASE_DIR="${CCTL_INSTANCE_BASE_DIR:-${CCTL_BASE_DIR}/instances}"

# Registry (ex: ghcr.io/usuario) — usado por `cctl build --push`.
# CCTL_REGISTRY_TOKEN (ou GHCR_TOKEN/DOCKER_TOKEN) nao tem default aqui de
# proposito: fica so no ambiente/sessao, nunca em arquivo versionado.
CCTL_REGISTRY="${CCTL_REGISTRY:-}"
CCTL_REGISTRY_USER="${CCTL_REGISTRY_USER:-}"

# Build customizado (`cctl build --custom <servico>`) — diretorio base da
# convencao docker/custom/<servico>/Dockerfile.
CUSTOM_BUILD_DIR="${CUSTOM_BUILD_DIR:-docker/custom}"

# Versao minima do Docker
CCTL_MIN_DOCKER_VERSION="${CCTL_MIN_DOCKER_VERSION:-24.0}"

# Cron e logrotate (cctl install/clear-all, lib/cron.sh, post-install.sh de
# templates) — FIXOS, nao derivam de CCTL_BASE_DIR: cron e logrotate leem de
# caminho fixo do sistema (nao seguem CCTL_BASE_DIR) e os arquivos instalados
# ali tem de ser root-owned. Quando nao gravaveis e sem sudo utilizavel, o
# cron degrada para a crontab do proprio usuario (ver lib/cron.sh); o
# logrotate apenas avisa e nao instala (root-only, sem fallback de usuario).
CRON_DIR="${CRON_DIR:-/etc/cron.d}"
LOGROTATE_DIR="${LOGROTATE_DIR:-/etc/logrotate.d}"

# Nginx (nginx-proxy) e SSL — fonte unica dos defaults: as libs (lib/nginx.sh,
# lib/ssl.sh) e commands/ apenas leem estas variaveis, nunca redeclaram o
# literal. Todas derivam de CCTL_BASE_DIR, com escape hatch proprio. Tudo do
# nginx-proxy mora sob CCTL_BASE_DIR/nginx-proxy/ (F2.1) — um unico ponto de
# certificado (LETSENCRYPT_DIR, RW, -> /etc/letsencrypt no container) que
# serve tanto o certbot (live/archive/renewal/accounts) quanto os modos
# manual/self-signed (<dominio>/{fullchain,privkey}.pem direto na raiz, sem
# o segmento "live"). SSL_CERTS_DIR foi fundido em LETSENCRYPT_DIR — so
# existia porque os dois modos tinham destinos diferentes; agora compartilham
# a mesma raiz, entao uma variavel basta (ver lib/ssl.sh). CERTBOT_WEBROOT_DIR
# tambem saiu: o webroot do certbot (/var/www/certbot) e interno ao container
# (sem mount, sem raiz propria no host) — DEPENDENCIA DA F3: a imagem ainda
# precisa CRIAR /var/www/certbot (medido: a imagem crua nao tem nem /var/www).
NGINX_CONTAINER_NAME="${NGINX_CONTAINER_NAME:-nginx-proxy}"
NGINX_VHOSTS_DIR="${NGINX_VHOSTS_DIR:-${CCTL_BASE_DIR}/nginx-proxy/vhosts.d}"
SSL_MODE="${SSL_MODE:-letsencrypt}"
LETSENCRYPT_DIR="${LETSENCRYPT_DIR:-${CCTL_BASE_DIR}/nginx-proxy/certs}"
# LETSENCRYPT_LIVE_DIR deriva de LETSENCRYPT_DIR — tem de vir DEPOIS dele
# (bug de ordem corrigido 2026-09-14: customizar so LETSENCRYPT_DIR agora
# propaga para o "live").
LETSENCRYPT_LIVE_DIR="${LETSENCRYPT_LIVE_DIR:-${LETSENCRYPT_DIR}/live}"
CERTBOT_EMAIL="${CERTBOT_EMAIL:-}"

# Proxy nativo (cctl proxy up/down/reload/test/logs/status) — fonte unica dos
# defaults aqui no cctl.conf (lib/nginx.sh apenas consome, nao redeclara)
PROXY_NETWORK="${PROXY_NETWORK:-cctl-proxy-net}"
NGINX_PROXY_IMAGE="${NGINX_PROXY_IMAGE:-ghcr.io/diegobianchetti/nginx-proxy:latest}"
PROXY_HTTP_PORT="${PROXY_HTTP_PORT:-80}"
PROXY_HTTPS_PORT="${PROXY_HTTPS_PORT:-443}"

# Rollout (cctl rollout bluegreen/rolling/status) — knobs documentados aqui
# para visibilidade; defaults reais em lib/rollout.sh
ROLLOUT_HEALTH_MODE="${ROLLOUT_HEALTH_MODE:-auto}"        # auto|docker|http
ROLLOUT_HEALTH_TIMEOUT="${ROLLOUT_HEALTH_TIMEOUT:-60}"    # segundos
ROLLOUT_HEALTH_INTERVAL="${ROLLOUT_HEALTH_INTERVAL:-2}"   # segundos entre sondas
ROLLOUT_HEALTH_PATH="${ROLLOUT_HEALTH_PATH:-/}"
ROLLOUT_HEALTH_PORT="${ROLLOUT_HEALTH_PORT:-}"            # vazio = derivar do vhost
ROLLOUT_DRAIN_SECONDS="${ROLLOUT_DRAIN_SECONDS:-10}"
ROLLOUT_STATE_FILE="${ROLLOUT_STATE_FILE:-.cctl-rollout}"
ROLLOUT_PROBE_CONTAINER="${ROLLOUT_PROBE_CONTAINER:-}"    # vazio = NGINX_CONTAINER_NAME
